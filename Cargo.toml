[package]
name = "mcp-federation"
version = "0.1.0"
edition = "2021"
description = "MCP federation server — aggregate and route tool calls across multiple MCP servers"
license = "MIT"
publish = false

[[bin]]
name = "mcp-federation"
path = "src/main.rs"

[lib]
name = "mcp_federation"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "net", "sync", "signal", "time", "process"] }
thiserror = "2"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
http = "1"
futures = "0.3"
tokio-stream = "0.1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
jsonwebtoken = "9"
rand = "0.8"
base64 = "0.22"
kube = { version = "4", features = ["runtime", "derive", "client"], optional = true }
k8s-openapi = { version = "0.28", features = ["latest"], optional = true }
schemars = { version = "1", optional = true }

[features]
default = []
crd = ["dep:kube", "dep:k8s-openapi", "dep:schemars"]

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
