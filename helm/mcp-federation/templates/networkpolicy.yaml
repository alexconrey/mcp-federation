{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcp-federation.fullname" . }}
  labels:
    {{- include "mcp-federation.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcp-federation.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
      {{- if .Values.networkPolicy.allowedCIDRs }}
      from:
        {{- range .Values.networkPolicy.allowedCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
      {{- if .Values.networkPolicy.allowedNamespaces }}
      from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      {{- end }}
{{- end }}
